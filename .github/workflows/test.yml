name: Review scheduling tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/spaced-review.test.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile UI
        run: |
          export TASME3_BROWSER_EXECUTABLE=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          node --test tests/browser.test.cjs
